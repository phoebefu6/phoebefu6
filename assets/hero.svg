<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img"
     aria-label="Phoebe Fu - data and applied AI, in public. Visit phoebefu6.github.io">
  <title>Phoebe Fu - data and applied AI, in public</title>
  <defs>
    <clipPath id="typeclip"><rect x="54" y="112" width="0" height="34">
      <animate attributeName="width" values="0;0;400;400;0"
               keyTimes="0;0.06;0.46;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- flat vivid field -->
  <rect width="900" height="200" fill="#FFD616"/>

  <!-- bold flat shapes, black-outlined like cut paper, drifting slowly -->
  <g stroke="#100C12" stroke-width="3.5">
    <circle cx="742" cy="58" r="47" fill="#8E5CF7">
      <animate attributeName="cy" values="58;76;58" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="818" cy="140" r="33" fill="#F45BC0">
      <animate attributeName="cy" values="140;124;140" dur="9s" repeatCount="indefinite"/>
    </circle>
    <rect x="678" y="118" width="46" height="46" rx="6" fill="#2A20D8">
      <animateTransform attributeName="transform" type="rotate"
                        values="-8 701 141;9 701 141;-8 701 141" dur="13s" repeatCount="indefinite"/>
    </rect>
    <!-- lightning bolt, a nod to the reference -->
    <path d="M862 34 L845 78 L864 76 L850 118 L888 66 L868 68 Z" fill="#F5433A">
      <animate attributeName="opacity" values="1;0.25;1;1" keyTimes="0;0.08;0.16;1"
               dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- offset double-print, the pop-poster move -->
    <text x="59" y="79" font-size="48" font-weight="800" fill="#F45BC0" letter-spacing="-1.2">Phoebe Fu</text>
    <text x="54" y="76" font-size="48" font-weight="800" fill="#100C12" letter-spacing="-1.2">Phoebe Fu</text>

    <rect x="54" y="92" width="0" height="6" fill="#F5433A" stroke="#100C12" stroke-width="2.5">
      <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.3;0.88;1"
               dur="9s" repeatCount="indefinite"/>
    </rect>

    <g clip-path="url(#typeclip)">
      <text x="54" y="138" font-size="25" font-weight="700" fill="#2A20D8"
            >Understanding is built, not read.</text>
    </g>

    <text x="54" y="177" font-size="15" font-weight="700" fill="#100C12"
          letter-spacing="2.6" opacity="0.72">DATA &#183; APPLIED AI &#183; IN PUBLIC</text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.55;1"
               dur="9s" repeatCount="indefinite"/>
      <rect x="404" y="158" width="218" height="30" rx="15" fill="#100C12"/>
      <text x="513" y="178" font-size="14" font-weight="700" fill="#FFD616"
            text-anchor="middle" letter-spacing="0.4">phoebefu6.github.io &#8594;</text>
    </g>
  </g>
</svg>
